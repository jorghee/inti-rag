[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inti-rag"
version = "0.1.0"
description = "Inti - Intelligent Legal Assistant powered by RAG architecture for UNSA law students"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "RodrigoAlexander", email = "ralexander@unsa.edu.pe" },
    { name = "Jorge Luis", email = "jorghee@unsa.edu.pe" },
    { name = "Jhonatan David Arias Quispe", email = "jariasq@unsa.edu.pe" },
    { name = "Rafael Diego Nina Calizaya", email = "rnina@unsa.edu.pe" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyjwt[crypto]>=2.8.0",
    "bcrypt>=4.1.2",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "ingestion*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend", "ingestion", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures/*" = ["E501"]
"tests/unit/test_chunker.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "ingestion"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require database or network)",
]
