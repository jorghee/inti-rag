<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escritorio Jurídico — Inti Asistente Jurídico (UNSA)</title>
  <meta name="description" content="Escritorio de investigación jurídica del asistente Inti para la Facultad de Derecho de la Universidad Nacional de San Agustín.">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <header class="app-navbar" role="banner">
    <div class="navbar-container">
      <div class="brand-group">
        <button
          type="button"
          id="btn-open-drawer"
          class="btn-mobile-drawer"
          aria-label="Abrir historial de sesiones"
          aria-controls="sessions-sidebar"
          aria-expanded="false">
          Historial
        </button>
        <div class="brand-logo-badge" data-icon="scale" aria-hidden="true"></div>
        <div class="brand-details">
          <span class="brand-name">Inti Asistente Jurídico</span>
          <span class="brand-affiliation">Facultad de Derecho — UNSA</span>
        </div>
      </div>

      <div class="user-nav-actions">
        <div class="user-identity-card" id="user-badge">
          <div class="user-avatar-circle" data-icon="user" aria-hidden="true"></div>
          <div class="user-info-text">
            <span class="user-display-name" id="user-display-name">Usuario UNSA</span>
            <span class="user-role-badge" id="user-display-role">Estudiante</span>
          </div>
        </div>

        <button type="button" class="btn-logout" id="btn-logout">
          <span class="ui-icon-slot" data-icon="logout" aria-hidden="true"></span>
          <span>Salir</span>
        </button>
      </div>
    </div>
  </header>

  <div id="overlay-backdrop" class="overlay-backdrop" aria-hidden="true"></div>

  <div class="workspace-shell">
    <!-- Columna 1: Historial de Sesiones (Drawer en movil) -->
    <aside id="sessions-sidebar" class="sessions-sidebar" aria-label="Historial de consultas">
      <div class="sidebar-header">
        <h2 class="sidebar-title">Expedientes y Sesiones</h2>
        <button type="button" id="btn-close-drawer" class="btn-close-panel" aria-label="Cerrar historial">
          Cerrar
        </button>
      </div>
      <div class="sidebar-actions">
        <button type="button" id="btn-new-session" class="btn-new-session">
          Nueva consulta jurídica
        </button>
      </div>
      <nav id="sessions-list" class="sessions-list-container" aria-label="Lista de sesiones guardadas"></nav>
      <div class="sidebar-footer">
        <span id="sidebar-user-email">cuenta@unsa.edu.pe</span>
      </div>
    </aside>

    <!-- Columna 2: Hoja Central de Analisis -->
    <main class="research-pane" role="main">
      <div class="research-header">
        <h1 id="research-title" class="research-title">Nueva consulta jurídica</h1>
        <span class="corpus-badge">Código Civil 1984 · SPIJ</span>
      </div>

      <div id="status-banner" class="status-banner" role="alert" aria-live="polite"></div>

      <section id="conversation-thread" class="conversation-thread" aria-label="Hilo de consultas y respuestas"></section>

      <form id="query-form" class="query-composer" novalidate>
        <label for="legal-query-input" class="composer-label">
          Consulta jurídica sobre el Código Civil peruano
        </label>
        <textarea
          id="legal-query-input"
          name="query"
          class="query-input"
          required
          minlength="3"
          maxlength="2000"
          placeholder="Describa el caso o artículo a consultar (ej. responsabilidad extracontractual, nulidad del acto jurídico, compraventa)..."></textarea>
        <div class="composer-footer">
          <span class="composer-hint">Cada respuesta cita únicamente artículos verificados en el corpus indexado.</span>
          <button type="submit" id="btn-submit-query" class="btn-query">
            Consultar Asistente
          </button>
        </div>
      </form>
    </main>

    <!-- Columna 3: Inspector Normativo (Panel inferior en movil) -->
    <aside
      id="citation-inspector"
      class="citation-inspector"
      aria-label="Inspector normativo de citas">
      <div class="inspector-header">
        <h2 class="inspector-title">Inspector Normativo</h2>
        <button type="button" id="btn-close-inspector" class="btn-close-panel" aria-label="Cerrar inspector normativo">
          Cerrar
        </button>
      </div>
      <div id="inspector-body" class="inspector-body"></div>
    </aside>
  </div>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
